<p-dialog header="Menu"
          [(visible)]="infoService.dialogsHandler.isShowMenuDialog"
          [modal]="true"
          (onShow)="onShow()"
          (onHide)="onHide()"
          [draggable]="true"
          [resizable]="false"
          [style]="{width: '75vw'}"
          [contentStyle]="{height: '75vw'}"
>

  <p-tabView (onChange)="onTabChange($event)">
    <p-tabPanel [selected]="selectedInstrument==0" header="Piano">
      <ng-template [ngTemplateOutletContext]="{items:filterByInstrument('piano')}"
                   [ngTemplateOutlet]="TableContentsTemplate"></ng-template>
    </p-tabPanel>
    <p-tabPanel [selected]="selectedInstrument==1" header="Button Accordion">
      <ng-template [ngTemplateOutletContext]="{items:filterByInstrument('button accordion')}"
                   [ngTemplateOutlet]="TableContentsTemplate"></ng-template>
    </p-tabPanel>
    <p-tabPanel [selected]="selectedInstrument==2" header="Piano Accordion">
      <ng-template [ngTemplateOutletContext]="{items:filterByInstrument('piano accordion')}"
                   [ngTemplateOutlet]="TableContentsTemplate"></ng-template>
    </p-tabPanel>
  </p-tabView>

  <ng-template pTemplate="footer">
    <div style="padding:5px;border: 0px solid black;width:100%;height:100%;overflow: hidden"
         fxLayout="row nowrap"
         fxLayoutAlign="space-between center">
      <div style="padding:0;border: 0px solid red;height:100%;width:100%;overflow: hidden;">
      </div>
      <div style="margin-top:10px;">
        <p-button icon="pi pi-check" (click)="this.infoService.dialogsHandler.isShowMenuDialog=false" label="Ok"
                  styleClass="p-button-text"></p-button>
      </div>
    </div>
  </ng-template>
</p-dialog>

<ng-template let-items='items' #TableContentsTemplate>
  <p-table *ngIf="!catalogueService.isLoading" [value]="items" [scrollable]="true"
           styleClass="p-datatable-gridlines p-datatable-striped"
           scrollHeight="flex">
    <ng-template pTemplate="header">
      <tr>
        <th [style]="{maxWidth:columnWidthCounter+'px'}">#</th>
        <th style="width:50%">Title</th>
        <th style="width:50%">Author</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-record>
      <tr>
        <td>{{ record.index }}</td>
        <td><a style="color:blue;" href="index.html?path={{record.path}}">{{ record.title }}</a></td>
        <td>{{ record.author }}</td>
      </tr>
    </ng-template>
  </p-table>
</ng-template>
